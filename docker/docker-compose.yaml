services:
  qdrant:
    image: qdrant/qdrant:latest
    # restart: always
    container_name: ju_bot_qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    # configs:
    #   - source: qdrant_config
    #     target: /qdrant/config/production.yaml
    volumes:
      - qdrant_ju_bot_data:/qdrant/storage

volumes:
  qdrant_ju_bot_data:
