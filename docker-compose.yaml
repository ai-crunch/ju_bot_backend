services:
  mongodb:
    image: mongo:7.0
    container_name: ju_bot_mongodb
    restart: unless-stopped
    ports:
      - "27077:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ju_bot_feedback}
    networks:
      - ju_bot_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ju_bot_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ju_bot_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ju_bot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB configuration - use service name for internal communication
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_DATABASE: ${MONGO_DATABASE:-ju_bot_feedback}
      # Qdrant configuration - use service name for internal communication
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-ju_bot_vdb}
      # OpenAI API Key (required)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Admin user seeding (optional)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - .:/app
      - ./data:/app/data
      - ./ocr_results:/app/ocr_results
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - ju_bot_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../ju_bot_frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: ju_bot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ju_bot_network

volumes:
  mongodb_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  ju_bot_network:
    driver: bridge
